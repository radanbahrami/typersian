name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-startup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1 libxcb-cursor0 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Try starting the app (Linux, headless)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a python main.py & sleep 5; kill %1

      - name: Try starting the app (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: python main.py & sleep 5; kill %1
